<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — PruTech IT Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/brand.css" />
</head>
<body class="auth-body">
  <div class="auth-bg"><canvas id="authCanvas"></canvas></div>

  <header class="auth-top">
    <a href="prutech-it-solutions.html" class="nav__logo nav__logo--img"><img src="img/prutech-logo-white.svg" alt="PruTech IT Solutions" /></a>
    <a href="prutech-it-solutions.html" class="auth-back">← Back to site</a>
  </header>

  <main class="chooser">
    <div class="chooser__head">
      <p class="kicker kicker--green">Secure Access</p>
      <h1 class="chooser__title">Choose how you'd like to <span class="grad">sign in.</span></h1>
      <p class="chooser__sub">Select your portal to continue.</p>
    </div>

    <div class="portal-cards portal-cards--2">
      <button class="portal portal--primary" type="button">
        <div class="portal__icon">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        </div>
        <h3>Customer Login</h3>
        <p>Track projects, tickets and deliverables in your client space.</p>
        <span class="portal__cta">Continue →</span>
      </button>

      <button class="portal" type="button">
        <div class="portal__icon">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        </div>
        <h3>Careers Login</h3>
        <p>Apply, track applications and explore roles at PruTech.</p>
        <span class="portal__cta">Continue →</span>
      </button>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
